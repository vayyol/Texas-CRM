<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="content-language" content="pt-BR" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Texas CRM — acompanhamento de clientes simples para pequenos empreendedores e autônomos. Organize seus clientes, acompanhe orçamentos e pagamentos e saiba quem precisa da sua atenção agora." />
    <meta name="theme-color" content="#4f46e5" />
    <meta property="og:title" content="Texas CRM — Acompanhamento de clientes simples e organizado" />
    <meta property="og:description" content="Organize seus clientes, acompanhe orçamentos e pagamentos e saiba quem precisa da sua atenção agora. Tudo em um só lugar." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>Texas CRM — Acompanhamento de clientes simples e organizado</title>
    <script>
      (function() {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
